[project]
name = "aurora-mjo"
version = "0.1.0"
description = "Fine-tuning Microsoft Aurora for MJO sub-seasonal prediction."
requires-python = ">=3.10,<3.11"   # NARROW: microsoft-aurora's constraint

dependencies = [
    # Runtime only — everything imported by src/ or scripts/ at runtime,
    # even if it currently arrives via another package's dependencies.
    # Versions pinned from $HOME/aurora-backup/aurora_mjo-list-20260908.txt
    "microsoft-aurora==1.8.0",
    "torch==2.5.1",
    "numpy==2.2.6",
    "xarray==2025.6.1",
    "netcdf4==1.7.4",       # dataset.py passes engine="netcdf4" explicitly
    "h5netcdf==1.8.1",      # inspect_vars.py passes engine="h5netcdf"
    "dask==2026.3.0",
    "pandas==2.3.3",
    "pyyaml==6.0.3",        # config loading
    "typer==0.25.1",        # run.py, added in C2
    "matplotlib==3.10.9",   # scripts/plot_loss.py
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "pre-commit>=3.8",
    "pyrefly>=1.2.0",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora_mjo"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
# Exclude legacy un-refactored files so A3 respects "Must not touch src/ and scripts/"
exclude = [
    "src/**",
    "scripts/**",
    "train.py",
    "*.md",
    "docs/**",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E402"]   # scripts may adjust sys.path before importing
"run.py" = ["B008"]       # typer's API is function calls in argument defaults

# TODO(C1): Existing lint findings in src/ and root to be resolved during package migration
"src/aurora_mjo/dataset.py" = ["E501", "F841", "B028"]
"src/aurora_mjo/loss.py" = ["B006", "E501"]
"src/aurora_mjo/trainer.py" = ["B905"]
"src/aurora_mjo/model.py" = ["UP038"]

# TODO(C3): Existing lint findings in scripts/ and tools/ to be resolved during scripts refactoring
"scripts/compute_rmm.py" = ["F841"]
"scripts/evaluate_mjo.py" = ["F821", "B007", "E501", "UP038"]
"scripts/explore_nersc_data.py" = ["E501"]
"scripts/plot_loss.py" = ["E501", "UP015"]
"scripts/scan_for_bad_values.py" = ["E501"]
"scripts/smoke_test_freeze.py" = ["F401", "E501", "UP038"]
"scripts/test_num_workers.py" = ["B023", "B007", "F821", "E722"]
"scripts/verify_dataset_loader.py" = ["E501"]
"scripts/diagnose_val_nan.py" = ["B007"]
"scripts/inspect_vars.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --ignore=scripts"
markers = [
    "needs_data: needs the real CFS ERA5 archive. Excluded from CI.",
    "needs_gpu: needs a CUDA device. Excluded from CI.",
    "slow: takes more than a few seconds.",
    "live: needs a live external system (CDS API, HF hub). Excluded from CI.",
]

[tool.pyrefly]
# RATCHET, not a permanent exclusion. Entries come OFF this list, never on.
# ~6950 lines of untyped scientific Python; trainer.py alone is 1138.
# See docs/campaigns/refactor/01_TARGET_STATE.md D5.
project-excludes = [
    "scripts/**",
    "slurm_scripts/**",
    "src/aurora_mjo/checkpoint.py",
    "src/aurora_mjo/dataset.py",
    "src/aurora_mjo/loss.py",
    "src/aurora_mjo/model.py",
    "src/aurora_mjo/trainer.py",
    "train.py",
]

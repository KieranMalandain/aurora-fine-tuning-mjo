# configs/phase2_rollout_lora.yaml
# Phase 2 Rollout with LoRA: multi-step autoregressive training with
# LoRA adapters enabled for increased trainable capacity.
#
# Key differences from phase1_baseline:
#   - use_lora: true          (LoRA adapters unfrozen in backbone)
#   - rollout enabled 1→4     (curriculum grows every 2 epochs)
#   - use_amp: true           (bf16 mixed precision on A100)
#   - lr: 5e-5                (lower for rollout stability)
#   - grad_accum_steps: 4     (compensates for small BS under multi-step)
#   - NO physics loss          (deferred until baseline is stable)
#
# Epochs 1-2 are effectively single-step (Phase 1), giving an implicit
# baseline before the rollout horizon grows.
#
# Run:
#   sbatch slurm_scripts/train_rollout.slurm

experiment:
  name: "phase2_rollout_lora"
  description: >
    Multi-step autoregressive rollout training (T=1→4) with LoRA adapters.
    Tropical-weighted L1 loss accumulated at every rollout step with uniform
    weighting. No physics loss — deferred until this baseline is stable.
  seed: 42

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
data:
  use_dummy: false

  root: /global/cfs/cdirs/m4946/xiaoming/zm4946.MachLearn/PrcsPrep/prcs.ERA5/prcs.ERA5.Remap/Results
  slt_path: /pscratch/sd/k/kam352/Aurora/slt/slt_data.nc

  dummy:
    surface_files: []
    pressure_files: []
    static_file: ""

  real:
    train_years: [1980, 2015]
    val_years:   [2016, 2019]
    test_years:  [2020, 2023]

  batch_size: 1
  num_workers: 4
  pin_memory: true

# ---------------------------------------------------------------------------
# Model — LoRA ENABLED
# ---------------------------------------------------------------------------
model:
  model_type: "small"
  use_lora: true
  lora_mode: "single"
  gradient_checkpointing: false   # Enable at rollout k>=3 if OOM

  surface_variables:
    - "2t"
    - "10u"
    - "10v"
    - "msl"
    - "ttr"
    - "tcwv"

  norm_stats:
    ttr:  { mean: -226.0498, std: 49.2158 }
    tcwv: { mean: 18.2967,   std: 16.3265 }

  mjo_head:
    enabled: false

# ---------------------------------------------------------------------------
# Losses — grid only, no physics
# ---------------------------------------------------------------------------
loss:
  grid:
    enabled: true
    tropics_bbox: [-20, 20]
    tropics_weight: 1.0
    extratropics_weight: 0.1

  spectral:
    enabled: false
    weight: 0.0

  mjo_head:
    enabled: false
    weight: 0.0

  moisture_budget:
    enabled: false
    weight: 0.0

# ---------------------------------------------------------------------------
# Training — rollout curriculum + AMP
# ---------------------------------------------------------------------------
training:
  epochs: 20
  grad_accum_steps: 1            # 4 GPUs × batch_size=1 = effective BS=4; no accumulation needed
  max_grad_norm: 1.0
  use_amp: true                  # AMP mixed precision (bf16 on A100)

  optimizer:
    name: "adamw"
    lr: 5.0e-5                   # Lower LR than phase1 for rollout stability
    weight_decay: 1.0e-5
    betas: [0.9, 0.999]

  scheduler:
    name: "cosine"
    warmup_steps: 200
    eta_min: 1.0e-6

  # Rollout curriculum: start at 1 step, grow by 1 every 2 epochs, cap at 4
  # Epoch  1-2:  k=1  (effectively Phase 1 single-step baseline)
  # Epoch  3-4:  k=2
  # Epoch  5-6:  k=3
  # Epoch  7+:   k=4
  rollout:
    enabled: true
    start_steps: 1
    max_steps: 4
    step_increase_every_n_epochs: 2
    step_loss_weighting: "uniform"

# ---------------------------------------------------------------------------
# Checkpointing & Logging
# ---------------------------------------------------------------------------
checkpointing:
  save_dir: "checkpoints/phase2_rollout_lora"
  save_every_n_epochs: 1
  keep_last_n: 5

logging:
  log_every_n_steps: 10
  val_every_n_epochs: 1
  use_wandb: false
  project: "aurora-mjo"
